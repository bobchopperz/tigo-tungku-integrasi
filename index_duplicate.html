/* ══ RESET ═════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body { font-family: var(--font); background: var(--krem); color: var(--abu); overflow-x: hidden; line-height: 1.6; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--merah); border-radius: 2px; }
img { max-width: 100%; display: block; }

/* ══ SISTEM HALAMAN ════════════════════════════════════════════════ */
.halaman { display: none; }
.halaman.aktif { display: block; }

/* ══ TOMBOL BAHASA ═════════════════════════════════════════════════ */
.tombol-bahasa {
position: fixed; top: 18px; right: 18px; z-index: 999;
display: flex; background: var(--putih); border: 1px solid var(--abu-200);
border-radius: 100px; padding: 3px;
box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.tb {
font-family: var(--font); font-size: 11px; font-weight: 700;
letter-spacing: 0.06em; padding: 5px 13px; border: none;
background: none; cursor: pointer; border-radius: 100px;
color: var(--abu-muda); transition: all 0.2s;
}
.tb.aktif { background: var(--biru); color: var(--putih); }

/* ══ NAVIGASI ══════════════════════════════════════════════════════ */
nav {
position: fixed; top: 0; left: 0; right: 0; z-index: 900;
height: 68px; padding: 0 48px;
display: flex; align-items: center; justify-content: space-between;
transition: all 0.3s;
}
nav.tergulir {
background: rgba(250,250,250,0.97); backdrop-filter: blur(16px);
border-bottom: 1px solid var(--abu-200);
box-shadow: 0 2px 20px rgba(0,0,0,0.06);
}
.logo {
display: flex; align-items: center; gap: 11px;
text-decoration: none; cursor: pointer;
}
.logo-nama { font-size: 13px; font-weight: 700; color: var(--biru); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.2; }
.logo-alamat { font-size: 9.5px; color: var(--abu-muda); letter-spacing: 0.04em; font-weight: 400; line-height: 1.4; }
.tautan-nav { display: flex; align-items: center; gap: 30px; list-style: none; }
.tautan-nav a,
.tautan-nav button {
font-size: 13px; font-weight: 400; text-decoration: none;
background: none; border: none; cursor: pointer; font-family: var(--font);
transition: color 0.2s; color: rgba(255,255,255,0.8); padding: 0;
}
nav.tergulir .tautan-nav a,
nav.tergulir .tautan-nav button { color: var(--abu); }
.tautan-nav a:hover, .tautan-nav button:hover { color: var(--putih); }
nav.tergulir .tautan-nav a:hover,
nav.tergulir .tautan-nav button:hover { color: var(--biru); }
.nav-cta {
background: var(--merah) !important; color: var(--putih) !important;
padding: 9px 22px !important; border-radius: 7px; font-weight: 600 !important;
}
.nav-cta:hover { background: var(--merah-tua) !important; color: var(--putih) !important; }
.nav-verifikasi {
display: inline-flex; align-items: center; gap: 6px;
padding: 8px 16px !important; border-radius: 7px; font-weight: 500 !important;
background: rgba(255,255,255,0.1) !important;
border: 1px solid rgba(255,255,255,0.2) !important;
}
nav.tergulir .nav-verifikasi {
background: var(--abu-100) !important; color: var(--biru) !important;
border-color: var(--abu-200) !important;
}
.nav-verifikasi:hover { background: rgba(178,53,50,0.15) !important; color: var(--putih) !important; }
nav.tergulir .nav-verifikasi:hover { background: var(--biru) !important; color: var(--putih) !important; }

/* ══ HERO ══════════════════════════════════════════════════════════ */
.hero {
min-height: 100vh; background: var(--biru-tua);
display: flex; align-items: center;
position: relative; overflow: hidden;
padding: 100px 48px 80px;
}
.hero::before {
content: '';
position: absolute; inset: 0;
background:
radial-gradient(ellipse 55% 60% at 78% 32%, rgba(178,53,50,0.2) 0%, transparent 55%),
linear-gradient(145deg, #021d38 0%, #03254c 55%, #053a6e 100%);
}
.hero-kisi {
position: absolute; inset: 0;
background-image:
linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
background-size: 52px 52px;
}
.hero-konten {
position: relative; z-index: 2;
max-width: 1160px; margin: 0 auto; width: 100%;
display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 72px; align-items: center;
}
.hero-label {
display: inline-flex; align-items: center; gap: 8px;
background: rgba(178,53,50,0.2); border: 1px solid rgba(178,53,50,0.4);
padding: 5px 14px; border-radius: 100px; margin-bottom: 22px;
animation: naik 0.6s ease both;
}
.hero-label span { font-size: 11px; color: #e88080; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
h1 {
font-size: clamp(34px, 5vw, 62px); font-weight: 800; color: var(--putih);
line-height: 1.08; letter-spacing: -0.025em; margin-bottom: 20px;
animation: naik 0.6s 0.08s ease both;
}
h1 .aksen { color: var(--merah); }
.hero-uraian {
font-size: 15px; color: rgba(255,255,255,0.68); line-height: 1.8;
max-width: 500px; margin-bottom: 36px; font-weight: 300;
animation: naik 0.6s 0.16s ease both;
}
.hero-tombol { display: flex; gap: 14px; flex-wrap: wrap; animation: naik 0.6s 0.24s ease both; }
.tombol-merah {
display: inline-flex; align-items: center; gap: 8px;
background: var(--merah); color: var(--putih); padding: 14px 28px;
border-radius: 8px; font-size: 14px; font-weight: 600;
text-decoration: none; transition: all 0.25s;
box-shadow: 0 4px 20px rgba(178,53,50,0.4); letter-spacing: 0.01em;
}
.tombol-merah:hover { background: var(--merah-tua); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(178,53,50,0.45); }
.tombol-transparan {
display: inline-flex; align-items: center; gap: 8px;
color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 400;
text-decoration: none; padding: 14px 0;
border-bottom: 1px solid rgba(255,255,255,0.25); transition: all 0.25s;
background: none; border-top: none; border-left: none; border-right: none;
cursor: pointer; font-family: var(--font);
}
.tombol-transparan:hover { color: var(--putih); border-bottom-color: rgba(255,255,255,0.6); gap: 14px; }
.hero-pil { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; animation: naik 0.6s 0.32s ease both; }
.pil {
font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.06);
border: 1px solid rgba(255,255,255,0.14); padding: 5px 13px;
border-radius: 100px; font-family: 'Courier New', monospace;
}
.hero-kanan { animation: naik 0.6s 0.2s ease both; }
.judul-ruang {
font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
color: rgba(255,255,255,0.45); text-transform: uppercase; margin-bottom: 16px;
}
.kisi-ruang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kartu-ruang {
background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
border-radius: 11px; padding: 16px; transition: all 0.25s; cursor: default;
}
.kartu-ruang:hover { background: rgba(178,53,50,0.12); border-color: rgba(178,53,50,0.35); }
.kr-ikon { font-size: 20px; margin-bottom: 8px; display: block; }
.kr-nama { font-size: 12px; font-weight: 700; color: var(--putih); margin-bottom: 3px; }
.kr-isi { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.55; font-weight: 300; }
.kartu-ruang.dominan {
grid-column: span 2;
background: rgba(178,53,50,0.15); border-color: rgba(178,53,50,0.35);
display: flex; align-items: center; gap: 14px;
}
.kartu-ruang.dominan .kr-ikon { font-size: 22px; margin-bottom: 0; flex-shrink: 0; }

@keyframes naik {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: none; }
}

/* ══ PITA BERJALAN ═════════════════════════════════════════════════ */
.pita {
background: var(--merah); padding: 12px 0; overflow: hidden;
}
.pita-konten { display: flex; animation: jalan 22s linear infinite; white-space: nowrap; }
.pita-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 30px; }
.pita-item span { font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.08em; }
.pita-pemisah { width: 4px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 50%; flex-shrink: 0; }
@keyframes jalan { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ══ TATA LETAK UMUM ════════════════════════════════════════════════ */
.bagian { max-width: 1160px; margin: 0 auto; padding: 88px 48px; }
.bg-abu { background: var(--abu-100); }
.bg-biru { background: var(--biru-tua); }
.bg-biru-mid { background: var(--biru); }
.label-bagian {

}
.lb-titik { width: 7px; height: 7px; background: var(--merah); border-radius: 50%; flex-shrink: 0; }
.lb-teks { font-size: 11px; font-weight: 700; color: var(--merah); letter-spacing: 0.18em; text-transform: uppercase; }
h2 { font-size: clamp(24px, 3.5vw, 40px); font-weight: 800; color: var(--biru); line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 14px; }
h2 .aksen { color: var(--merah); }

.uraian { font-size: 15px; color: var(--abu-muda); line-height: 1.75; font-weight: 300; max-width: 540px; }

/* ══ KALIBRASI ALAT KESEHATAN ══════════════════════════════════════ */
.blok-utama {
display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: start; margin-top: 52px;
}
.kartu-utama {
background: var(--putih); border-radius: 14px; overflow: hidden;
border: 2px solid var(--merah); position: relative;
box-shadow: 0 8px 40px rgba(178,53,50,0.12);
}
.kartu-utama-header {
background: var(--merah); padding: 22px 28px;
display: flex; align-items: center; gap: 14px;
}
.kuh-ikon { font-size: 28px; flex-shrink: 0; }
.kuh-judul { font-size: 17px; font-weight: 800; color: var(--putih); margin-bottom: 2px; }
.kuh-sub { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; }
.kartu-utama-isi { padding: 24px 28px; }
.daftar-alat { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.daftar-alat li {
font-size: 13px; color: var(--abu); display: flex;
align-items: flex-start; gap: 8px; line-height: 1.5;
}
.daftar-alat li::before {
content: ''; width: 5px; height: 5px; background: var(--merah);
border-radius: 50%; flex-shrink: 0; margin-top: 5px;
}
.regulasi-label {
font-size: 10px; font-weight: 700; color: var(--abu-muda);
letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 8px;
}
.regulasi-pil-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.reg-pil {
font-size: 10.5px; font-weight: 500; color: var(--merah);
background: rgba(178,53,50,0.08); border: 1px solid rgba(178,53,50,0.2);
padding: 4px 12px; border-radius: 100px; font-family: 'Courier New', monospace;
}
.bagian-kanan { display: flex; flex-direction: column; gap: 14px; }
.kartu-kal {
background: var(--putih); border: 1px solid var(--abu-200); border-radius: 13px;
padding: 22px; transition: all 0.3s; position: relative; overflow: hidden;
}
.kartu-kal::before {
content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
background: var(--abu-200); transition: background 0.3s;
}
.kartu-kal:hover { box-shadow: 0 8px 28px rgba(3,37,76,0.08); transform: translateX(3px); }
.kartu-kal:hover::before { background: var(--biru); }
.kk-judul { font-size: 14px; font-weight: 700; color: var(--biru); margin-bottom: 6px; display: flex; align-items: center; gap: 9px; }
.kk-ikon { font-size: 18px; }
.kk-daftar { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.kk-daftar li { font-size: 12.5px; color: var(--abu); display: flex; align-items: flex-start; gap: 7px; line-height: 1.5; }
.kk-daftar li::before { content: ''; width: 4px; height: 4px; background: var(--biru); border-radius: 50%; flex-shrink: 0; margin-top: 5px; opacity: 0.5; }
.kartu-tambahan {
background: var(--biru); border-radius: 13px; padding: 22px;
}
.kartu-tambahan .kk-judul { color: var(--putih); }
.kartu-tambahan .kk-daftar li { color: rgba(255,255,255,0.75); }
.kartu-tambahan .kk-daftar li::before { background: var(--merah); opacity: 1; }

/* Referensi standar bar */
.bar-standar {
margin-top: 32px; background: var(--biru); border-radius: 11px;
padding: 18px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;

.bs-label {
font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55);

.bs-pil {

background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
padding: 4px 12px; border-radius: 100px; font-family: 'Courier New', monospace;
}

<script>

/* ── SISTEM HALAMAN ── */
function tampilHalaman(nama) {
document.querySelectorAll('.halaman').forEach(h => h.classList.remove('aktif'));
document.getElementById('halaman-' + nama).classList.add('aktif');
window.scrollTo({ top: 0, behavior: 'smooth' });
if (nama === 'beranda') {
document.getElementById('hasil-verifikasi').innerHTML = '';
document.getElementById('hasil-verifikasi').style.display = 'none';
document.getElementById('nomor-sertifikat').value = '';
hentiPindai();
}
}

/* ── BAHASA ── */
let bahasa = 'id';
function aturBahasa(b) {
bahasa = b;
document.getElementById('b-id').classList.toggle('aktif', b === 'id');
document.getElementById('b-en').classList.toggle('aktif', b === 'en');
document.querySelectorAll('[data-id]').forEach(el => {
const v = el.getAttribute('data-' + b);
if (v !== null) el.innerHTML = v;
});
}

/* ── NAVIGASI GULIR ── */
window.addEventListener('scroll', () => {
document.getElementById('nav').classList.toggle('tergulir', scrollY > 40);
});

/* ── ANIMASI MUNCUL ── */
const pengamat = new IntersectionObserver(entri => {
entri.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.08 });
document.querySelectorAll('.rv').forEach(el => pengamat.observe(el));

/* ── GULIR HALUS ── */
document.querySelectorAll('a[href^="#"]').forEach(a => {
a.addEventListener('click', e => {
const t = document.querySelector(a.getAttribute('href'));
if (t) {
e.preventDefault();
tampilHalaman('beranda');
setTimeout(() => t.scrollIntoView({ behavior: 'smooth' }), 120);
}
});
});

/* ── FORMULIR KONTAK ── */
function kirimForm() {
const nama = document.getElementById('f-nama').value || '—';
const jml = document.getElementById('f-jml').value || '—';
const ket = document.getElementById('f-ket').value || '—';
const pesan = bahasa === 'id'
? `Halo TTI,%0A%0ASaya ingin mengajukan permintaan kalibrasi.%0A%0ANama/Perusahaan: ${encodeURIComponent(nama)}%0AJumlah instrumen: ${encodeURIComponent(jml)}%0AKeterangan: ${encodeURIComponent(ket)}%0A%0ATerima kasih.`
: `Hello TTI,%0A%0AI would like to request a calibration service.%0A%0AName/Company: ${encodeURIComponent(nama)}%0AInstruments: ${encodeURIComponent(jml)}%0ADetails: ${encodeURIComponent(ket)}%0A%0AThank you.`;
window.open(`https://wa.me/6281372855990?text=${pesan}`, '_blank');
}

/* ══ VERIFIKASI SERTIFIKAT ══ */

/* Ganti tab */
function gantiTab(tab) {
document.getElementById('tab-manual').classList.toggle('aktif', tab === 'manual');
document.getElementById('tab-pindai').classList.toggle('aktif', tab === 'pindai');
document.getElementById('area-manual').style.display = tab === 'manual' ? 'block' : 'none';
document.getElementById('area-pemindai').style.display = tab === 'pindai' ? 'block' : 'none';
if (tab === 'pindai') mulaiPindai();
else hentiPindai();
}

/* Cari sertifikat */
function cariSertifikat() {
const nomor = document.getElementById('nomor-sertifikat').value.trim().toUpperCase();
if (!nomor) return;
const data = DB_SERTIFIKAT[nomor] || null;
tampilkanHasil(data, nomor);
}

/* Tampilkan hasil */
function tampilkanHasil(data, kueri) {
const el = document.getElementById('hasil-verifikasi');
el.style.display = 'block';

if (!data) {
el.innerHTML = `
<div class="kosong">
<div class="kosong-ikon">🔍</div>
<h3>${bahasa==='id' ? 'Sertifikat Tidak Ditemukan' : 'Certificate Not Found'}</h3>
<p>${bahasa==='id'
? `Nomor sertifikat <strong>${kueri}</strong> tidak terdapat dalam sistem kami.<br>Pastikan nomor yang Anda masukkan sudah benar, atau hubungi TTI untuk konfirmasi.`
: `Certificate number <strong>${kueri}</strong> was not found in our system.<br>Please verify the number, or contact TTI for confirmation.`}</p>
</div>`;
return;
}

const label = data.labelStatus[bahasa] || data.labelStatus['id'];
const statusKls = data.status;

const labelBerlaku = bahasa==='id' ? 'Berlaku Hingga' : 'Valid Until';
const nilaiKls = data.status === 'habis' ? 'habis' : data.status === 'hampir' ? 'hampir' : 'valid';
const ikonStatus = data.status === 'habis' ? '⚠️' : data.status === 'hampir' ? '⏰' : '✓';

const tombolUnduh = data.adaPdf
? `<button class="tombol-unduh" onclick="unduhPdf('${data.id}')">⬇ ${bahasa==='id'?'Unduh Sertifikat PDF':'Download Certificate PDF'}</button>`
: `<button class="tombol-unduh nonaktif" disabled>⬇ ${bahasa==='id'?'PDF Tidak Tersedia':'PDF Unavailable'}</button>`;

el.innerHTML = `
<div class="kartu-hasil">
<div class="hasil-kepala ${statusKls}">
<div class="status-wrap">
<div class="status-titik"></div>
<div class="status-teks">${label}</div>
</div>
<div class="lencana-id">${data.id}</div>
</div>
<div class="hasil-tubuh">
<div class="hasil-kisi">
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Nama Perusahaan':'Company Name'}</div>
<div class="hb-nilai">${data.perusahaan}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Instrumen':'Instrument'}</div>
<div class="hb-nilai">${data.instrumen}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Nomor Seri':'Serial Number'}</div>
<div class="hb-nilai mono">${data.serialNo}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">Tag / ID</div>
<div class="hb-nilai mono">${data.tag}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Tanggal Kalibrasi':'Calibration Date'}</div>
<div class="hb-nilai">${data.tglKalibrasi}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${labelBerlaku}</div>
<div class="hb-nilai ${nilaiKls}">${data.berlakuHingga} ${data.status!=='valid'?ikonStatus:''}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Hasil As Found':'Result As Found'}</div>
<div class="hb-nilai">${data.hasilAsFound}</div>
</div>
<div class="hasil-baris">
<div class="hb-label">${bahasa==='id'?'Hasil As Left':'Result As Left'}</div>
<div class="hb-nilai">${data.hasilAsLeft}</div>
</div>
<div class="hasil-baris" style="grid-column:span 2;">
<div class="hb-label">${bahasa==='id'?'Diterbitkan Oleh':'Issued By'}</div>
<div class="hb-nilai">${data.penerbit}</div>
</div>
</div>
</div>
<div class="hasil-kaki">
${tombolUnduh}
<div class="catatan-hasil">${bahasa==='id'?'Dokumen ini diterbitkan oleh PT Tigo Tungku Integritas.':'This document was issued by PT Tigo Tungku Integritas.'}</div>
</div>

}

/* Unduh PDF */
function unduhPdf(idSertifikat) {
alert(bahasa==='id'
? `Mengunduh sertifikat ${idSertifikat}…\n\n(Dalam implementasi: berkas PDF akan diunduh dari server TTI.)`
: `Downloading certificate ${idSertifikat}…\n\n(In production: PDF will be downloaded from TTI server.)`);
}

/* ── PEMINDAI ── */
let aliranVideo = null;
let intervalPindai = null;

async function mulaiPindai() {
const video = document.getElementById('video-qr');
try {
aliranVideo = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
});
video.srcObject = aliranVideo;
await video.play();

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

intervalPindai = setInterval(() => {
if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
// Attempt QR decode via BarcodeDetector API (Chrome 83+)
if (window._barcodeDetector) {
window._barcodeDetector.detect(canvas).then(codes => {
if (codes.length > 0) {
const teks = codes[0].rawValue.toUpperCase().trim();
hentiPindai();
gantiTab('manual');
document.getElementById('nomor-sertifikat').value = teks;
cariSertifikat();
}
}).catch(() => {});
}
}, 400);

// Init BarcodeDetector if available
if ('BarcodeDetector' in window) {
window._barcodeDetector = new BarcodeDetector({
formats: ['qr_code', 'code_128', 'code_39', 'data_matrix', 'ean_13', 'ean_8']
});
} else {
// Fallback: show manual hint
document.querySelector('.petunjuk-pindai').textContent =
bahasa === 'id'
? 'Kamera aktif. Jika pemindaian otomatis tidak bekerja, catat nomor sertifikat dan masukkan secara manual.'
: 'Camera active. If auto-scan does not work, note the certificate number and enter it manually.';
}

} catch(err) {
document.getElementById('area-pemindai').innerHTML =
`<div style="padding:24px;text-align:center;color:var(--abu-muda);font-size:13px;">
⚠️ ${bahasa==='id'?'Izin kamera tidak diberikan. Harap aktifkan akses kamera pada peramban Anda.':'Camera permission denied. Please enable camera access in your browser.'}
</div>`;
}
}

function hentiPindai() {
if (aliranVideo) { aliranVideo.getTracks().forEach(t => t.stop()); aliranVideo = null; }
if (intervalPindai) { clearInterval(intervalPindai); intervalPindai = null; }
const video = document.getElementById('video-qr');
if (video) video.srcObject = null;
}

window.addEventListener('beforeunload', hentiPindai);
</script>
